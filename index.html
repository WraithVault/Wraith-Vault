/* =====================================================
   WRAITH VAULT — PREMIUM VISUAL REDESIGN
   Paste this at the VERY BOTTOM of your existing <style>
===================================================== */

:root {
    --wv-bg: #030303;
    --wv-white: #ffffff;
    --wv-muted: #8b8b8b;
    --wv-border: rgba(255,255,255,.10);
    --wv-glass: rgba(255,255,255,.035);
}

/* MAIN ATMOSPHERE */

body {
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,255,255,.13),
            transparent 32%
        ),
        radial-gradient(
            circle at 0% 45%,
            rgba(255,255,255,.055),
            transparent 28%
        ),
        radial-gradient(
            circle at 100% 75%,
            rgba(255,255,255,.045),
            transparent 30%
        ),
        #030303 !important;

    color: #fff;
}


/* ANIMATED LIGHT LAYER */

body::before {
    content: "";
    position: fixed;
    inset: -25%;

    pointer-events: none;
    z-index: -5;

    background:
        radial-gradient(
            circle at 25% 25%,
            rgba(255,255,255,.08),
            transparent 18%
        ),
        radial-gradient(
            circle at 75% 65%,
            rgba(255,255,255,.055),
            transparent 20%
        );

    filter: blur(55px);

    animation:
        wvAtmosphere 18s ease-in-out infinite alternate;
}


@keyframes wvAtmosphere {

    0% {
        transform:
            translate3d(-2%, -1%, 0)
            scale(1);
    }

    50% {
        transform:
            translate3d(3%, 2%, 0)
            scale(1.08);
    }

    100% {
        transform:
            translate3d(-1%, 4%, 0)
            scale(1.03);
    }
}


/* NAVBAR */

nav {
    background:
        rgba(3,3,3,.72) !important;

    backdrop-filter:
        blur(22px)
        saturate(140%) !important;

    -webkit-backdrop-filter:
        blur(22px)
        saturate(140%) !important;

    border-bottom:
        1px solid rgba(255,255,255,.08) !important;

    box-shadow:
        0 10px 45px rgba(0,0,0,.35);
}


/* LOGO */

.logo-image {
    box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 0 30px rgba(255,255,255,.13) !important;

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}

.logo:hover .logo-image {
    transform:
        rotate(-4deg)
        scale(1.08);

    box-shadow:
        0 0 0 1px rgba(255,255,255,.20),
        0 0 45px rgba(255,255,255,.22) !important;
}


/* HERO */

.hero {
    position: relative;
}

.hero::before {
    content: "";

    position: absolute;

    width: 650px;
    height: 650px;

    left: 50%;
    top: 38%;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.08),
            transparent 65%
        );

    filter: blur(35px);

    pointer-events: none;
}


.hero h1 {
    text-shadow:
        0 0 50px rgba(255,255,255,.07);
}


.hero h1 .gradient {
    background:
        linear-gradient(
            110deg,
            #ffffff 0%,
            #a5a5a5 28%,
            #ffffff 50%,
            #666666 72%,
            #ffffff 100%
        );

    background-size: 250% auto;

    animation:
        wvText 7s linear infinite;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}


@keyframes wvText {

    to {
        background-position:
            250% center;
    }
}


/* BUTTONS */

.btn {
    position: relative;
    overflow: hidden;

    border:
        1px solid rgba(255,255,255,.12);

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}


.btn::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    transform:
        skewX(-20deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transition:
        left .6s ease;
}


.btn:hover::before {
    left: 140%;
}


.btn-primary:hover {
    box-shadow:
        0 15px 55px rgba(255,255,255,.18);
}


/* STATS */

.stats {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.018)
        ) !important;

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.30);
}


/* ALL CARDS */

.card,
.staff-card,
.leakers-team,
.discord-wrap {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.018)
        ) !important;

    backdrop-filter:
        blur(18px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(130%);

    border:
        1px solid rgba(255,255,255,.09) !important;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.045),
        0 20px 70px rgba(0,0,0,.20);

    transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease !important;
}


.card:hover,
.staff-card:hover,
.leakers-team:hover {
    border-color:
        rgba(255,255,255,.25) !important;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 25px 80px rgba(0,0,0,.45),
        0 0 45px rgba(255,255,255,.035);
}


/* CARD ICONS */

.icon,
.staff-icon {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.025)
        ) !important;

    border:
        1px solid rgba(255,255,255,.13) !important;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 10px 35px rgba(0,0,0,.25);
}


/* CATEGORY LINKS */

.card-link {
    position: relative;

    transition:
        color .25s ease,
        letter-spacing .25s ease;
}


.card:hover .card-link {
    letter-spacing: 1.3px;
}


/* STAFF NAMES */

.staff-name,
.leaker {
    background:
        rgba(255,255,255,.045) !important;

    border:
        1px solid rgba(255,255,255,.09) !important;

    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        color .25s ease;
}


.staff-name:hover,
.leaker:hover {
    background:
        rgba(255,255,255,.11) !important;

    border-color:
        rgba(255,255,255,.22) !important;

    color:
        #fff !important;

    transform:
        translateY(-3px);
}


/* LEAKERS AREA */

.leakers-team {
    position: relative;
}


.leakers-team::after {
    content: "";

    position: absolute;

    width: 300px;
    height: 120px;

    bottom: -100px;
    left: 50%;

    transform:
        translateX(-50%);

    background:
        rgba(255,255,255,.07);

    filter:
        blur(80px);

    pointer-events: none;
}


/* DISCORD AREA */

.discord-wrap {
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 30px 100px rgba(0,0,0,.40);
}


.server-picture {
    box-shadow:
        0 0 0 1px rgba(255,255,255,.12),
        0 20px 60px rgba(255,255,255,.10) !important;

    transition:
        transform .4s ease,
        box-shadow .4s ease;
}


.server-picture:hover {
    transform:
        scale(1.07)
        rotate(2deg);

    box-shadow:
        0 0 0 1px rgba(255,255,255,.22),
        0 25px 75px rgba(255,255,255,.17) !important;
}


/* SECTION HEADINGS */

.section-header h2 {
    text-shadow:
        0 0 35px rgba(255,255,255,.055);
}


/* FOOTER */

footer {
    background:
        rgba(0,0,0,.25);

    backdrop-filter:
        blur(15px);
}


/* CUSTOM SCROLLBAR */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: #030303;
}

::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            #777,
            #222
        );

    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: #aaa;
}


/* TEXT SELECTION */

::selection {
    background: #fff;
    color: #000;
}


/* MOBILE */

@media (max-width: 650px) {

    .hero::before {
        width: 380px;
        height: 380px;
    }

    body::before {
        opacity: .7;
    }

}
